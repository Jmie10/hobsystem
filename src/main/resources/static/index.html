<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House of Brew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f1ee;--card:#fff;--ink:#2b1812;--mute:#7a6258;--line:#e5d8d1;--pri:#683021;--pri-ink:#fff;--acc:#c9993f;--bad:#b3261e;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b110d;--card:#281a14;--ink:#f3e8e1;--mute:#b49d90;--line:#43302a;--pri:#d49a80;--pri-ink:#2a110a;--bad:#ff8a80;--ok:#7bd39b}}
:root[data-theme="dark"]{--bg:#1b110d;--card:#281a14;--ink:#f3e8e1;--mute:#b49d90;--line:#43302a;--pri:#d49a80;--pri-ink:#2a110a;--bad:#ff8a80;--ok:#7bd39b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:14px}
.lg{background:#fdfdfd;border-radius:12px;padding:2px 8px;display:flex}
.lg img{height:56px;width:auto;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
main{max-width:1080px;margin:0 auto;padding:20px}
.tabs{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;margin-bottom:16px}
.tabs button{width:100%;text-align:center;padding-left:6px;padding-right:6px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.btn.p{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
@media(max-width:940px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:20px;margin-bottom:12px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item b{font-size:17px}.price{font-weight:700;color:var(--pri)}
.item.off{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
label{display:block;font-weight:500;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:99px;padding:5px 12px;font-size:14px}
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.tbl{aspect-ratio:1;min-width:0;padding:2px;overflow:hidden;border-radius:50%;border:2px solid var(--ok);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tbl small{font-weight:400;color:var(--mute);font-size:12px;text-align:center;line-height:1.25}
.tbl.taken{border-color:var(--bad);border-style:dashed;opacity:.55;cursor:not-allowed}
.tbl.sel{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tbl.sel small{color:var(--pri-ink)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid currentColor}
.Pending{color:var(--bad)}.Preparing{color:#b07a00}.Ready{color:var(--ok)}.Served,.Confirmed{color:var(--pri)}.Cancelled{color:var(--mute)}
.bar{height:10px;border-radius:5px;background:var(--pri);min-width:4px}
.msg{padding:10px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--acc);margin:10px 0;font-size:14px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.stat{font:800 28px "Bricolage Grotesque",sans-serif;color:var(--pri)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px;width:100%}
.dlg h2{font-size:20px;margin-bottom:8px}.dlg p{margin:0 0 16px;color:var(--mute)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
.idb{background:var(--pri);color:var(--pri-ink);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.item .top{display:flex;gap:10px;align-items:center}
.ico{flex:none;background:#f4ebe3;border-radius:12px;padding:3px;display:flex}
.pw{position:relative}.pw input{padding-right:44px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mute);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px}
.eye svg{width:20px;height:20px}
.rc .row b{text-align:right}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none}.dlg button{display:none}}
.link{background:none;border:0;padding:0;color:var(--pri);text-decoration:underline;cursor:pointer;font:inherit}
.authwrap{min-height:calc(100vh - 170px);display:flex;align-items:center;justify-content:center}
.authbox{width:100%;max-width:440px;margin:0}
.authbox>h2{text-align:center;margin-bottom:14px}
.fs{border:0;padding:0;margin:0;min-width:0}
.lock{background:var(--bg);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0 10px}
.meter{margin-top:8px}.mbar{display:flex;gap:4px}.mbar i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.meter.s1 .mbar i:nth-child(1){background:var(--bad)}.meter.s2 .mbar i:nth-child(-n+2){background:#d89a1b}.meter.s3 .mbar i{background:var(--ok)}
.mtxt{font-size:13px;font-weight:700}.meter.s1 .mtxt{color:var(--bad)}.meter.s2 .mtxt{color:#b07a00}.meter.s3 .mtxt{color:var(--ok)}
.undo{margin:-6px 0 14px}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;font-weight:500}
.pager .btn{min-width:46px;font-size:20px;line-height:1;padding:6px 14px}.pager .btn:disabled{opacity:.35;cursor:not-allowed}
.menuwrap{position:relative}
.userbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}
.dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:170px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:40;padding:6px}
.dd button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
.dd button:hover{background:var(--bg)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px;margin-bottom:6px}
.search{margin-bottom:10px}
.row.editrow{flex-wrap:wrap;align-items:flex-end;gap:10px;padding:10px 0}
.shell{display:grid;grid-template-columns:112px minmax(0,1fr);height:100vh;height:100dvh}
.content{min-width:0;min-height:0;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:16px 20px 20px}
.side{display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);height:100vh;height:100dvh;overflow-y:auto}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 4px;border:0;border-left:4px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:center;width:100%;border-radius:0}
.nav:hover{background:var(--bg)}
.nav{font-size:12px;letter-spacing:-.1px}
.nav[aria-pressed="true"]{border-left-color:var(--pri);background:var(--bg);font-weight:700}
.fmsg:empty{display:none}.fmsg .msg{margin:10px 0 0}
.req{color:var(--bad);font-weight:700}
.filters.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters input,.filters select{height:44px;box-sizing:border-box;width:100%;padding:0 10px}
@media(max-width:640px){.filters.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.dt{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:72px minmax(0,1fr);gap:10px}.nav{font-size:11px;padding:12px 2px;border-left-width:3px}.nav svg{width:22px;height:22px}main{padding:12px}.panel{padding:12px}.tables{gap:6px}.tbl{font-size:13px}.tbl small{font-size:11px}header{padding:12px}}
@media(prefers-reduced-motion:no-preference){.tbl,.btn{transition:background .15s}}

/* ---- app frame: sidebar + full-height content ---- */
body:not(.auth){overflow:hidden}
.side .lg{margin:14px auto 10px}
.side .lg img{height:48px}
.topbar{display:flex;flex:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.topbar h1{font-size:26px}
.view{flex:1;min-height:0;overflow-y:auto}
.view.fit{overflow:hidden;display:flex;flex-direction:column}
.ordgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;flex:1;min-height:0}
.ordgrid>.panel{display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2px}
.menu{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.item{padding:0;gap:0;overflow:hidden}
.item .ph{background:#f3ece4;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.item .ph{position:relative;overflow:hidden}
.item .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.item .ph.dr{aspect-ratio:3/4;background:#f7f8fa}
.item .ph.dr img{object-position:50% 50%}
.item .ph svg{width:84px;height:84px}
.item .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .ds{font-size:13px;line-height:1.35;color:var(--mute);min-height:2.7em}
.item .buy{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .buy .price{margin-right:auto}
.item .buy .btn{flex:1 0 100%}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:transparent;color:var(--ink);width:28px;height:30px;font:inherit;font-size:18px;cursor:pointer}
.step span{min-width:22px;text-align:center;font-weight:700}
.fl{display:flex;align-items:center;gap:8px;margin:0;font-size:13px}
.fl select{width:auto;flex:1;padding:5px 8px}
.seg{margin-top:4px}.seg button{flex:1}
textarea{resize:none;font:inherit}
.olist{margin-top:10px;border-top:1px solid var(--line)}
.olist .row .nm{flex:1;min-width:0}
.ofoot{flex:none;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.ofoot .row{border:0}.tot{font-size:22px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:500;cursor:pointer}.chk input{width:18px;height:18px;margin:0;accent-color:var(--pri)}.rsv{margin-top:4px}.rsv label{margin-top:8px}
.ordpanel{overflow-y:auto}.ordpanel>*{flex-shrink:0}.ordpanel .olist{flex:none;min-height:90px;max-height:200px}.ordpanel .ofoot{position:sticky;bottom:0;background:var(--card);margin-top:auto}
.ordpanel .cid{margin:0 0 6px;font-size:13px;color:var(--mute)}
/* ---- login page: photo on the left, form on the right ---- */
.authpage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.authhero{position:relative;color:#fff;background:linear-gradient(180deg,rgba(30,15,9,.5) 0%,rgba(30,15,9,.62) 45%,rgba(30,15,9,.88) 100%),url(img/login-bg.jpg) center/cover;padding:36px 44px;display:flex;flex-direction:column;justify-content:space-between}
.authhero .bn{display:flex;align-items:center;gap:12px;font:800 22px "Bricolage Grotesque",sans-serif}
.authhero .lg img{height:44px}
.authhero .eb{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#e6b48c;font-weight:700;margin:0 0 14px}
.authhero h2{font-size:clamp(38px,5vw,60px);line-height:1.02;font-weight:800}
.authhero .sub{max-width:360px;margin:18px 0 0;color:#eadbd1}
.authhero .hrs{font-size:14px;color:#d9c7bb}
.authside{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:32px;overflow-y:auto}
.authbox{max-width:448px}
.authbox .eb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pri);font-weight:700;margin:0 0 8px}
.authbox h2{font-size:34px;text-align:left;margin-bottom:18px}
.authbox .tabs{background:var(--line);padding:4px;border-radius:10px;gap:4px}
.authbox .tabs button{border:0;background:transparent;border-radius:7px;padding:9px}
.authbox .tabs button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.authside .panel{border:0;background:transparent;padding:0}
/* ---- sidebar buttons: dark rounded tile when active ---- */
.side{gap:8px;padding:6px 0 12px}
.nav{width:86px;height:86px;margin:0 auto;padding:8px 4px;border:0;border-radius:18px;transition:background .15s,color .15s}
.nav:hover{background:var(--bg)}
.nav{font-size:12px;letter-spacing:-.1px}
.nav[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);font-weight:600}
@media(max-width:560px){.nav{width:62px;height:66px;font-size:11px;border-radius:14px}}
@media(max-width:940px){
 body:not(.auth){overflow:auto}
 .shell{height:auto;min-height:100dvh}.side{position:sticky;top:0}
 .content{height:auto;padding:12px}.view,.view.fit{overflow:visible;display:block}
 .ordgrid{display:block}.ordgrid>.panel{margin-bottom:16px}.scroll{overflow:visible}
 .topbar h1{font-size:20px}
 .authpage{grid-template-columns:minmax(0,1fr)}.authhero{padding:24px;min-height:300px}.authhero .sub{display:none}.authside{padding:24px 18px}
}

/* ---- fixes: field heights, mobile sidebar column, completed tag, receipt scroll ---- */
input:not([type=checkbox]):not([type=radio]),select{height:42px}
.dlg.rc{max-height:92vh;overflow-y:auto}
.Completed{color:var(--ok)}
@media(max-width:940px){.shell{gap:0;background:linear-gradient(to right,var(--card) 0,var(--card) calc(var(--sw,112px) - 1px),var(--line) calc(var(--sw,112px) - 1px),var(--line) var(--sw,112px),transparent var(--sw,112px))}.side{border-right:0}.content{padding:12px}}
@media(max-width:560px){.shell{--sw:72px}}
.phone{display:flex}.phone .pre{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--line);font-weight:600}.phone input{border-radius:0 8px 8px 0}
</style>
</head>

const slotPast=(d,t)=>{const p=phParts(),now=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute),[y,mo,da]=d.split("-").map(Number),h=+t.split(":")[0];return Date.UTC(y,mo-1,da+(h<6?1:0),h,0)+3600000<=now};

const ERRMSG={400:"Some details are missing or incorrect. Please check and try again.",401:"Please log in again.",403:"Your account cannot do this action.",404:"We could not find that. Please refresh the page and try again.",409:"That conflicts with an existing record. Please refresh and try again.",429:"Too many attempts. Please wait a moment and try again.",500:"Something went wrong on our side. Please try again in a moment.",502:"The server is waking up. Please wait a few seconds and try again.",503:"The server is waking up. Please wait a few seconds and try again."};
async function api(path,method="GET",body){
 const h={"Content-Type":"application/json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;
 let r;try{r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined})}catch(e){throw new Error("Cannot reach the server. Check your internet connection and try again.")}
 let d=null;try{d=await r.json()}catch(e){}
 if(r.status==401&&TOKEN){clearLogin();draw()}
 if(!r.ok){const er=new Error((d&&d.message)||ERRMSG[r.status]||"Something went wrong. Please try again.");if(d&&d.retryAfter)er.retryAfter=d.retryAfter;throw er}
 return d}

function flash(m,id){const t=(id&&$(id))||$("fm-page")||$("fm-order")||$("fm-book")||$("app"),d=document.createElement("div");d.className="msg";d.setAttribute("role","alert");d.textContent=m;

function pageOf(key,list){const n=Math.max(1,Math.ceil(list.length/PER)),p=Math.min(Math.max(PG[key]||1,1),n);PG[key]=p;
 return{items:list.slice((p-1)*PER,p*PER),bar:`<div class="pager"><button class="btn" data-pg="${key}" data-to="${p-1}" ${p<=1?"disabled":""} aria-label="Previous page">&#8249;</button><span>Page ${p} of ${n}</span><button class="btn" data-pg="${key}" data-to="${p+1}" ${p>=n?"disabled":""} aria-label="Next page">&#8250;</button></div>`}}
/* password strength: 0 weak (not allowed), 1 medium, 2 strong */
function strength(p){const L=/[a-z]/.test(p),Up=/[A-Z]/.test(p),D=/\d/.test(p),Y=/[^A-Za-z0-9]/.test(p);
 if(p.length<8||!(L||Up)||!D)return 0;return(p.length>=10&&L+Up+D+Y>=3)?2:1}
const SNAME=["Weak","Medium","Strong"];

function icon(m){const n=m.n;
 if(/fries/i.test(n))return ICON.fries;if(/nachos/i.test(n))return ICON.nachos;if(/cheese/i.test(n))return ICON.cheese;if(/onion/i.test(n))return ICON.rings;
 if(m.c=="Meals")return ICON.plate;
 if(/^rice$/i.test(n))return ICON.bowl;if(/^egg$/i.test(n))return ICON.egg;if(/sauce\/dip/i.test(n))return ICON.dip;if(/syrup/i.test(n))return ICON.syrup;if(/espresso/i.test(n))return ICON.shot;
 const col=(DRINK.find(d=>d[0].test(n))||[0,"#8b5a3c"])[1];
 return /\(Hot\)/.test(n)?hotCup(col):icedCup(col,m.c=="Soda")}

 const row=(a,b)=>`<div class="row"><span>${a}</span><b>${esc(String(b))}</b></div>`;
 ov.innerHTML=`<div class="dlg rc" role="dialog" aria-modal="true" aria-labelledby="rt1"><h2 id="rt1">House of Brew</h2><p style="margin-bottom:8px">${o.paid?"Official receipt":"Order summary (not paid yet)"}</p>
 ${row("Order no.","#"+String(o.id).padStart(4,"0"))}${row("Customer",o.name)}${row("Customer ID",o.cno||"-")}${row("Date",fdt(o.paid?o.paidAt:o.at))}${row("Order type",tl(o))}
 <div style="margin:8px 0;border-top:1px dashed var(--line)"></div>
 ${o.items.map(i=>`<div class="row"><span>${esc(i.n)} × ${i.q}</span><b>${peso(i.p*i.q)}</b></div>`).join("")}

 ${o.notes?`<p class="empty" style="margin:8px 0 0"><b>Note:</b> ${esc(o.notes)}</p>`:""}
 <p class="empty" style="margin:10px 0 0">${o.paid?"Paid. Thank you for dining with us!":"Not paid yet. Please pay at the counter to get your official receipt."}</p>
 <div class="two" style="margin-top:12px"><button class="btn" id="rcprint">Print</button><button class="btn p" id="rcdone">Done</button></div></div>`;
 document.body.appendChild(ov);const close=()=>ov.remove();$("rcdone").focus();
 $("rcdone").onclick=close;$("rcprint").onclick=()=>window.print();ov.onclick=e=>{if(e.target===ov)close()};ov.onkeydown=e=>{if(e.key=="Escape")close()}}

const FLAVORS=["Cheese","Sour Cream","BBQ"],QTY={},FL={};let OT="Dine-in",NOTES="",selTable=1,ORS=false;

const DESC={"flavored fries":"Crispy fries tossed in your choice of flavor: cheese, sour cream or BBQ.","fries overload":"Fries loaded with savory beef, fresh toppings and a creamy drizzle.","nachos overload":"Crunchy nachos piled with savory beef, fresh toppings and a creamy drizzle.","cheese sticks":"Golden breaded cheese sticks served with a tangy dipping sauce.","onion rings":"Crispy battered onion rings served with a creamy dip.",

const baseName=n=>n.replace(/\s*\((Hot|Iced)\)\s*$/i,"");
const imgSlug=n=>{const b=baseName(n).toLowerCase(),al={"nachos overload":"nachos","cheese sticks":"cheese-stick","onion rings":"onion-rings","hob's drink":"hob"};return al[b]||b.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")};
const dsc=m=>{const d=DESC[baseName(m.n).toLowerCase()];if(d)return d;const t=/\(Hot\)/.test(m.n)?"served hot":/\(Iced\)/.test(m.n)?"served over ice":"";
 const k={"Coffee Based":"Espresso-based drink","Non Coffee":"Coffee-free drink","Soda":"Fizzy and refreshing"}[m.c];return k?k+(t?", "+t:"")+".":""};

function card(m){const s=imgSlug(m.n),q=QTY[m.id]||1;

function vOrder(){

 document.body.appendChild(ov);const close=()=>ov.remove();$("yes").focus();
 $("no").onclick=close;ov.onclick=ev=>{if(ev.target===ov)close()};ov.onkeydown=ev=>{if(ev.key=="Escape")close()};

  if(d.add){const m=allItems().find(x=>x.id==d.add),fl=isFlav(m)?(FL[m.id]||FLAVORS[0]):"",k=fl?m.id+"|"+fl:String(m.id),q=QTY[m.id]||1,nm=fl?m.n+" ("+fl+")":m.n;
   cart[k]=cart[k]||{n:nm,p:m.p,q:0};cart[k].q+=q;QTY[m.id]=1;push("Add "+nm,()=>{if(cart[k]&&(cart[k].q-=q)<=0)delete cart[k]});return draw()}
  if(d.dec){const c=cart[d.dec],k=d.dec;if(--c.q<=0)delete cart[k];push("Remove "+c.n,()=>{cart[k]=cart[k]||{n:c.n,p:c.p,q:0};cart[k].q++});return draw()}
  if(d.tb){selT=+d.tb;return draw()}
  if(d.adv){const o=S.orders.find(x=>x.id==d.adv);return act(()=>o.s=="Pending"?api("/api/kitchen/start-next","POST"):api("/api/orders/"+o.id+"/advance","POST"))}
  if(d.pay)return act(()=>api("/api/orders/"+d.pay+"/pay","POST")).then(()=>{const o=S.orders.find(x=>x.id==d.pay);if(o&&o.paid)showOrderReceipt(o)});
  if(d.conf)return act(()=>api("/api/reservations/"+d.conf+"/confirm","POST"));
  if(d.co)return confirmBox("Cancel this order?","Order #"+d.co+" will be removed. This only works before the kitchen starts preparing it.","Yes, cancel order","No, keep it",()=>act(()=>api("/api/my/orders/"+d.co+"/cancel","POST"),"Order cancelled.","fm-page"));
  if(d.cr)return confirmBox("Cancel this reservation?","Your table will be released. This only works before the staff confirms the booking.","Yes, cancel reservation","No, keep it",()=>act(()=>api("/api/my/reservations/"+d.cr+"/cancel","POST"),"Reservation cancelled.","fm-page-r"));
  if(d.done)return act(()=>api("/api/reservations/"+d.done+"/complete","POST"),"Table is available again.","fm-page");
  if(d.or){const o=S.orders.find(z=>z.id==d.or);if(o)showOrderReceipt(o);return}
  if(d.cx)return act(()=>api("/api/reservations/"+d.cx+"/cancel","POST"));
  if(d.tg)return act(()=>api("/api/menu/items/"+d.tg+"/toggle","POST"));
  if(d.del)return act(()=>api("/api/menu/items/"+d.del,"DELETE"));
  if(d.edit){editId=+d.edit;return draw()}
  if(d.cancel){editId=null;return draw()}
  if(id=="saveitem")return act(async()=>{await api("/api/menu/items/"+editId+"/update","POST",{name:$("en").value.trim(),category:$("ec").value.trim(),price:+$("ep").value});editId=null},"Item updated.");
  if(id=="bclear"){BF.from="";BF.to="";BF.status="All";BF.sort="new";PG.bill=1;return draw()}
  if(id=="place"){
   const prev=cart,items=Object.values(prev).map(c=>({name:c.n,price:c.p,qty:c.q})),rs=OT=="Dine-in"&&ORS,tn=OT=="Takeout"?0:(rs?selT:selTable),nt=NOTES.trim();
   if(rs&&!selT){flash("No free table for that date, time and party size. Try another time.","fm-order");return}
   if(rs&&slotPast(rf.date,rf.time)){flash("That time has already passed. Pick a later time.","fm-order");return}
   let RM="";
   return act(async()=>{
    if(rs){const r=await api("/api/reservations?client="+CID,"POST",{tableNo:selT,date:rf.date,time:rf.time,guests:rf.guests});
     try{await api("/api/orders?client="+CID,"POST",{tableNo:tn,orderType:OT,notes:nt,items})}catch(e){try{await api("/api/my/reservations/"+r.id+"/cancel","POST")}catch(x){}throw e}
     RM=" Table "+selT+" is reserved for "+rf.date+" at "+fmt(rf.time)+". Staff will confirm it.";ORS=false;selT=null}
    else await api("/api/orders?client="+CID,"POST",{tableNo:tn,orderType:OT,notes:nt,items});
    cart={};NOTES="";push("Place order",async()=>{});tab="Activity"},null,"fm-order").then(()=>{if(tab=="Activity")flash("Order placed!"+RM+" You can cancel it here until the kitchen starts preparing it.","fm-page")})}
  if(id=="book"){rf.guests=+$("rg").value;
   if(!selT){flash("Pick an available table first.","fm-book");return}
   let RC=null;
   return act(async()=>{const r=await api("/api/reservations?client="+CID,"POST",{tableNo:selT,date:rf.date,time:rf.time,guests:rf.guests});RC=mapRes(r);
    push("Reserve table",()=>api("/api/undo?client="+CID,"POST"));selT=null},"Reservation sent. Staff will confirm it shortly. You can cancel it in the Activity tab until then.","fm-book").then(()=>{if(RC)showReceipt(RC)})}
  if(id=="addm")return act(()=>api("/api/menu/items","POST",{name:$("an").value.trim(),category:$("ac").value.trim(),price:+$("ap").value}),"Item added.","fm-addm")};
 a.onkeydown=e=>{if(e.key!="Enter"||e.target.tagName!="INPUT")return;const z=e.target.closest("[data-enter]");if(z){e.preventDefault();const b=$(z.dataset.enter);if(b)b.click()}};
 a.oninput=e=>{const t=e.target;
  if(t.dataset.digits)t.value=t.value.replace(/\D/g,"");
  if(t.id=="sc"){let v=t.value;if(v.length>10&&v.startsWith("63"))v=v.slice(2);if(v.startsWith("0"))v=v.slice(1);t.value=v.slice(0,10)}
  if(t.dataset.name)t.value=t.value.replace(/[^\p{L} .'-]/gu,"");
  if(t.id=="onotes")NOTES=t.value;
  if(t.id=="sp"||t.id=="np"||t.id=="rp")updMeter(t.id);
  if(t.dataset.q){const k=t.dataset.q,pos=t.selectionStart;Q[k]=t.value;PG[k]=1;draw();const n=$(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}};
 a.onchange=e=>{const i=e.target.id,v=e.target.value;
  if(i=="ct")selTable=+v;
  if(i=="rtb")selT=+v;
  if(i=="ors"){ORS=e.target.checked;selT=null;return act(async()=>{},null,"fm-order")}
  if(e.target.dataset.fl)FL[e.target.dataset.fl]=v;
  if(i=="rg"){rf.guests=+v;selT=null;draw()}
  if(i=="rd"){rf.date=v;selT=null;act(async()=>{},null,"fm-book")}
  if(i=="rt"){rf.time=v;selT=null;act(async()=>{},null,"fm-book")}
  if(i=="bf"){BF.from=v;PG.bill=1;draw()}
  if(i=="bt"){BF.to=v;PG.bill=1;draw()}
  if(i=="bs"){BF.status=v;PG.bill=1;draw()}
  if(i=="rso"){RS=v;PG.res=1;draw()}
  if(i=="bo"){BF.sort=v;PG.bill=1;draw()}
  if(i=="oc"){Q.ocat=v;PG.omenu=1;draw()}}}

(async()=>{try{if(TOKEN){ME=await api("/api/auth/me");role=ROLE[ME.role];tab=TABS[role][0];await load()}draw();if(lockUntil>Date.now())tick()}
 catch(e){clearLogin();draw();flash(e.message)}})();
setInterval(()=>{if(ME&&!document.querySelector(".ov")&&!editId&&(role=="Staff"||(role=="Customer"&&tab=="Activity")))load().then(draw).catch(()=>{})},8000);
</script>
